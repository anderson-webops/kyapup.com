name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.13.0
  NPM_VERSION: 12.2.2
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare the independent locked build toolchain
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs

      - name: Install locked dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Audit development and production dependencies
        run: |
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures

      - name: Validate source and deployment output
        run: npm run validate

      - name: Prepare isolated Linux recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor
          sudo install -D -m 0755 /usr/bin/bwrap /opt/vitesse-test-tools/bwrap
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile vitesse-artifact-tests /opt/vitesse-test-tools/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/vitesse-artifact-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/vitesse-artifact-tests
          fi

      - name: Verify protected promotion and recovery
        run: PATH="/opt/vitesse-test-tools:$PATH" npm run test:promotion

      - name: Run accessibility smoke checks
        run: |
          npm run a11y
          npm run test:jsx-browser
          npm run test:router-browser
