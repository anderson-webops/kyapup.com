# Include this file inside the existing certificate-covered TLS server block.
# The surrounding server must retain both IPv4 and IPv6 listen directives.

root /srv/vitesse-nuxt-template/current/front-end/.output/public;
index index.html;

add_header Content-Security-Policy "base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

location = /healthz {
	access_log off;
	default_type application/json;
	add_header Cache-Control "no-store" always;
	try_files $uri =404;
}

location = /release.json {
	access_log off;
	default_type application/json;
	add_header Cache-Control "no-store" always;
	try_files $uri =404;
}

location /api/ {
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:3006;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 3s;
	proxy_read_timeout 15s;
	proxy_send_timeout 15s;
}

location /_nuxt/ {
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	try_files $uri =404;
}

location / {
	limit_except GET HEAD {
		deny all;
	}
	try_files $uri $uri.html $uri/ /index.html;
}
